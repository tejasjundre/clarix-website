[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"
  # FORM_TO_EMAIL is a public contact address that is intentionally displayed
  # on the site (contact/careers pages), so it is not a real secret.
  SECRETS_SCAN_OMIT_KEYS = "FORM_TO_EMAIL"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/enquiries"
  to = "/.netlify/functions/enquiries"
  status = 200

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
